{% extends "base.html" %}

{% block title %}Redefinir Senha - JustaConta{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto pt-10 sm:pt-20">
  <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 text-center">
    <div class="text-emerald-600 mb-4">Link enviado</div>
    <h3 class="text-xl font-bold text-slate-900 mb-2">Verifique seu e-mail</h3>
    <p class="text-slate-500 text-sm mb-6">
      Enviamos instruções para redefinir sua senha. Verifique sua caixa de entrada (e spam).
    </p>
    <a href="{% url 'login' %}" class="min-h-[48px] inline-flex items-center justify-center px-6 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all">
      Voltar ao login
    </a>
  </div>
</div>
{% endblock %}
