{% extends "base.html" %}

{% block title %}Redefinir Senha - JustaConta{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto pt-10 sm:pt-20">
  <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900">Redefinir Senha</h2>
      <p class="text-slate-500 text-sm mt-2">Digite seu e-mail para receber o link de redefinição</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label for="{{ form.email.id_for_label }}" class="block text-xs font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" name="{{ form.email.name }}" id="{{ form.email.id_for_label }}" autocomplete="email"
               class="w-full min-h-[48px] px-4 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
               placeholder="seu@email.com">
      </div>

      <button type="submit" class="w-full min-h-[48px] bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all">
        Enviar link de redefinição
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Já lembra a senha? <a href="{% url 'login' %}" class="text-indigo-600 hover:text-indigo-700">Faça login</a>
    </p>
  </div>
</div>
{% endblock %}
